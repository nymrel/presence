name: Nymrel guarded open-source maintenance

# Manual-only. Write-capable maintenance is coordinated at the organization
# level so small repositories do not create duplicate automated pull requests.
on:
  workflow_dispatch:

jobs:
  maintain:
    name: Propose guarded maintenance
    uses: nymrel/PermitMesh/.github/workflows/nymrel-hourly-worker.yml@3a3e9ea17ca7655cb635f06f7fb51aa0b00ce1c5
    with:
      canary_mode: false
      guard_ref: 3a3e9ea17ca7655cb635f06f7fb51aa0b00ce1c5
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write
      copilot-requests: write
