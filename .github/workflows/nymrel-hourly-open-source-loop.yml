name: Nymrel guarded open-source maintenance

# Manual-only. Write-capable maintenance is coordinated at the organization
# level so small repositories do not create duplicate automated pull requests.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: nymrel-hourly-open-source-loop
  cancel-in-progress: false

jobs:
  maintain:
    name: Propose guarded maintenance
    uses: nymrel/PermitMesh/.github/workflows/nymrel-hourly-worker.yml@3a3e9ea17ca7655cb635f06f7fb51aa0b00ce1c5
    with:
      canary_mode: false
      guard_ref: 3a3e9ea17ca7655cb635f06f7fb51aa0b00ce1c5
    permissions:
      actions: read # Inspect workflow state for guarded maintenance.
      contents: write # Commit proposed maintenance to a review branch.
      pull-requests: write # Open and update the proposed maintenance PR.
      copilot-requests: write # Request the configured coding agent for maintenance.
      statuses: write # Record guard results on the candidate commit.