name: Materialize tested Presence tree

on:
  push:
    branches:
      - sol/dual-approval-modes-hardening

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          check-latest: true
      - name: Verify and materialize tested tree
        shell: bash
        run: |
          set -euo pipefail
          cat .presence-bootstrap/part-* | base64 --decode > /tmp/presence-final.tar.gz
          echo "dbda03cc59245d1db9646daf3aa86d7db67532a5542edc101d5c59af6791a09e  /tmp/presence-final.tar.gz" | sha256sum -c -
          tar -xzf /tmp/presence-final.tar.gz -C .
          rm -rf .presence-bootstrap .github/workflows/presence-materialize.yml
          npm run check
          npm test
          git config user.name "nymrel-automation"
          git config user.email "automation@users.noreply.github.com"
          git add -A
          git commit -m "feat: add owner-authorized unrestricted approvals"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Triggered through the contents API after staging verification.
